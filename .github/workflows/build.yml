
name: Build WHold

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1

      - name: Build mod
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: WHold-26.3
          path: build/libs/*.jar
